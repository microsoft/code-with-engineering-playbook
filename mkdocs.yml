---
site_name: Engineering Fundamentals Playbook
site_url: https://microsoft.github.io/code-with-engineering-playbook
site_description: ISE Engineering Fundamentals Engineering Playbook
site_author: Microsoft ISE

repo_url: https://github.com/microsoft/code-with-engineering-playbook/
edit_uri: ""

theme:
  name: material
  custom_dir: mkdocs-overrides
  font:
    text: Roboto
  palette:
    primary: black
  logo: resources/ms_icon.png
  favicon: resources/ms_icon.png
  features:
    - navigation.instant
    - navigation.indexes

plugins:
  - search
  - git-revision-date-localized
  - awesome-pages
  - redirects:
      redirect_maps:
        # Removed page kept as a redirect: the URL was shared externally and in the root README.
        'the-first-week-of-an-ise-project.md': 'start-here/project-kickoff-checklist.md'

markdown_extensions:
  - meta
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.pathconverter
  - pymdownx.tabbed
  - mdx_truly_sane_lists
  - pymdownx.tasklist
